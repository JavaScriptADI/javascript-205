<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Clicker · solution</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./game.solution.js" defer></script>
</head>
<body>
    <main class="game">
        <header class="marquee">
            <span class="marquee__led" aria-hidden="true"></span>
            <h1 class="marquee__title">Coin Clicker</h1>
        </header>

        <div class="deck">
            <section class="console">
                <p id="score" class="readout" role="status">…</p>
                <p id="per-click" class="readout__meta">…</p>

                <button id="coin" aria-label="Collect a coin">🪙</button>
            </section>

            <section class="rail" aria-labelledby="shop-title">
                <h2 id="shop-title" class="rail__title">Shop</h2>
                <div id="shop"></div>
            </section>
        </div>

        <section class="race" aria-labelledby="race-title">
            <h2 id="race-title" class="rail__title">Race</h2>
            <button id="race-button">Start 10-second race</button>
            <p id="race-result" role="status"></p>
        </section>
    </main>
</body>
</html>
